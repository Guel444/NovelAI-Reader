name: novel_reader_mobile
description: "NovelAI Reader Mobile — leitor de EPUB com tradução por IA."
publish_to: 'none'
version: 0.1.0

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  archive: any
  xml: any
  html: any
  crypto: any
  path: any
  path_provider: any
  sqflite: any
  file_picker: any
  http: any
  share_plus: any
  syncfusion_flutter_pdf: any
  syncfusion_flutter_core: any

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  flutter_launcher_icons: any

flutter:
  uses-material-design: true
  assets:
    - assets/icon/

flutter_launcher_icons:
  android: true
  image_path: "assets/icon/app_icon.png"
